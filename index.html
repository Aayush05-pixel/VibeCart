<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeCart | Product Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <header class="hero">
    <nav class="site-nav">
      <a class="brand" href="#top">VibeCart<span>·</span></a>
      <div class="nav-actions">
<button id="manageToggle" class="manage-toggle" type="button">Manage products</button>
        <button id="cartButton" class="cart-button" type="button" aria-label="Open shopping bag">
          Bag <span id="cartCount">0</span>
        </button>
      </div>
    </nav>
    <p class="eyebrow">CURATED FOR EVERYDAY</p>
    <h1>Find your next <em>favorite.</em></h1>
    <p class="hero-text">A small gallery of useful things with a little extra personality.</p>
  </header>

  <main class="gallery-section">
    <div class="toolbar">
      <div class="filter-buttons" aria-label="Product categories">
        <button class="filter-button active" data-category="all">All products</button>
        <button class="filter-button" data-category="fashion">Fashion</button>
        <button class="filter-button" data-category="tech">Tech</button>
        <button class="filter-button" data-category="home">Home</button>
      </div>

      <label class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Search products">
      </label>

      <label class="sort-box">
        Sort
        <select id="sortSelect">
          <option value="default">Featured</option>
          <option value="low-high">Price: low to high</option>
          <option value="high-low">Price: high to low</option>
        </select>
      </label>
    </div>

    <p id="productCount" class="product-count"></p>
    <section id="productGrid" class="product-grid" aria-live="polite"></section>
    <p id="emptyMessage" class="empty-message" hidden>No products match your search.</p>

    <section id="favoritesSection" class="favorites-section" hidden>
      <div class="section-heading">
        <div>
          <p class="eyebrow">SAVED FOR LATER</p>
          <h2>Your favourites</h2>
        </div>
        <p id="favoritesCount" class="product-count"></p>
      </div>
      <div id="favoritesGrid" class="product-grid"></div>
    </section>

    <section id="manageSection" class="manage-section" hidden>
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR COLLECTION</p>
          <h2>Manage products</h2>
        </div>
        <button id="closeManage" class="close-button" type="button" aria-label="Close product manager">×</button>
      </div>

      <form id="productForm" class="product-form">
        <label>Product name<input name="name" type="text" placeholder="e.g. Canvas Notebook" required></label>
        <label>Price (₹)<input name="price" type="number" min="1" placeholder="e.g. 599" required></label>
        <label>Category
          <select name="category" required>
            <option value="fashion">Fashion</option>
            <option value="tech">Tech</option>
            <option value="home">Home</option>
          </select>
        </label>
        <label>Direct image URL (optional)<input name="imageUrl" type="url" placeholder="https://example.com/product.jpg"></label>
        <label>Or upload an image<input name="imageFile" type="file" accept="image/png, image/jpeg, image/webp, image/gif"></label>
        <label>Rating<input name="rating" type="number" min="1" max="5" step="0.1" value="4.5" required></label>
        <label class="description-field">Description<textarea name="description" rows="2" placeholder="Write a short description" required></textarea></label>
        <button class="add-product-button" type="submit">Add product</button>
      </form>

      <div id="manageProductsList" class="manage-products-list"></div>
    </section>
  </main>

  <div id="bagOverlay" class="bag-overlay"></div>
  <aside id="bagPanel" class="bag-panel" aria-label="Shopping bag" aria-hidden="true">
    <div class="panel-heading">
      <div>
        <p class="eyebrow">YOUR SELECTION</p>
        <h2>Shopping bag</h2>
      </div>
      <button id="closeBag" class="close-button" type="button" aria-label="Close shopping bag">×</button>
    </div>
    <div id="bagItems" class="bag-items"></div>
    <div class="bag-footer">
      <div class="bag-total"><span>Total</span><strong id="bagTotal">₹0</strong></div>
      <button class="checkout-button" type="button">Continue to checkout</button>
    </div>
  </aside>

  <div id="productModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalProductName" hidden>
    <div class="modal-card">
      <button id="closeModal" class="close-button modal-close" type="button" aria-label="Close product details">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <script src="script.js"></script>
</body>
</html>
